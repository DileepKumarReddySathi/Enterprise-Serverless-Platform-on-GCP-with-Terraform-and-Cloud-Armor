version: '3.8'

services:
  app:
    build:
      context: ./services/web-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/serverlessdb?sslmode=disable
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=serverlessdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d serverlessdb"]
      interval: 5s
      timeout: 5s
      retries: 5
