version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.21
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - cd services/web-api && go mod tidy
  pre_build:
    commands:
      - echo "Running tests..."
      # - go test ./...
  build:
    commands:
      - echo "Initializing Terraform..."
      - cd terraform
      - terraform init
      - terraform plan -var="db_password=$DB_PASSWORD"
  post_build:
    commands:
      - echo "Applying Terraform (Deployment)..."
      # - terraform apply -auto-approve -var="db_password=$DB_PASSWORD"
